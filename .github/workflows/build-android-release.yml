name: Build Android Release

on:
  push:
    branches: [main, feat/**]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL to embed in the app'
        required: true
        default: 'https://api-agenva.kidev.tec.br/v1'
      upload_artifact:
        type: boolean
        description: 'Upload APK as artifact'
        default: true

env:
  FLUTTER_VERSION: '3.27.1'
  JAVA_VERSION: '21'

jobs:
  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || env.API_BASE_URL }}

      - name: Upload APK artifact
        if: ${{ github.event.inputs.upload_artifact || true }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}