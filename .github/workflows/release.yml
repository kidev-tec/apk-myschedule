name: Release

on:
  push:
    tags:
      - 'v*'

# Sem isto o GITHUB_TOKEN é read-only e o upload da Release responde 403.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '17'

jobs:
  release-android:
    name: Release Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Sanitize Gradle properties for CI
        run: |
          sed -i -E '/org\.gradle\.java\.home=/d;/android\.aapt2FromMavenOverride=/d' android/gradle.properties
      - name: Dummy google-services.json (CI)
        run: test -f android/app/google-services.json || cp android/app/google-services.ci.json android/app/google-services.json
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (release)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL_PROD }}
      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: build/app/outputs/flutter-apk/app-release.apk

  release-ios:
    name: Release iOS (TestFlight)
    uses: ./.github/workflows/ios-testflight.yml
    secrets: inherit

  validate:
    name: Validate Release Gate
    runs-on: ubuntu-latest
    needs: [release-android, release-ios]
    if: always()
    steps:
      - name: Check All Jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success")'
