name: Release

on:
  push:
    tags:
      - 'v*'

# Sem isto o GITHUB_TOKEN é read-only e o upload da Release responde 403.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '17'

jobs:
  release-android:
    name: Release Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Sanitize Gradle properties for CI
        run: |
          sed -i -E '/org\.gradle\.java\.home=/d;/android\.aapt2FromMavenOverride=/d' android/gradle.properties

      # Firebase real: sem isso os resources saem com o ci-dummy e o login
      # quebra de vez (bug da v1.2.0: apiKey "dummy" embutida no APK).
      - name: Restore real google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "::error::Secret GOOGLE_SERVICES_JSON_B64 ausente"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));assert d['client'][0]['api_key'][0]['current_key'].startswith('AIza') and d['project_info']['project_id']!='ci-dummy', 'google-services.json invalido'"

      # Keystore de release FIXO: o SHA-1 dele está registrado no Firebase.
      # Sem keystore fixo, o runner gera um debug keystore novo a cada build
      # (bug da v1.2.0: SHA-1 desconhecido → Google login falha).
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret KEYSTORE_BASE64 ausente"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Secret KEYSTORE_PASSWORD ausente"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks || { echo "::error::Keystore vazio"; exit 1; }
          keytool -exportcert -keystore android/app/upload-keystore.jks -alias "${KEY_ALIAS:-agenva}" -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/release-cert.der"
          EXPECTED_SHA256=$(sha256sum "$RUNNER_TEMP/release-cert.der" | cut -d ' ' -f 1)
          echo "EXPECTED_SIGNING_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-agenva}" >> "$GITHUB_ENV"

      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      # APP_VERSION é a versão que o updater compara com /v1/version.
      # Sem ele o app se acha 1.0.0 e mostra o banner de atualização para sempre.
      - name: Build APK (release)
        run: |
          APP_VERSION=$(sed -n -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$APP_VERSION" || { echo "::error::version do pubspec.yaml não encontrada"; exit 1; }
          echo "APP_VERSION=$APP_VERSION"
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL_PROD }} \
            --dart-define=APP_VERSION=$APP_VERSION

      - name: Verify APK
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      # Gate: falha o release se o APK sair com Firebase dummy (nunca mais
      # deixar o bug da v1.2.0 passar em silêncio).
      - name: Verify Firebase config is real (anti-dummy gate)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          $BT/aapt2 dump resources build/app/outputs/flutter-apk/app-release.apk > /tmp/res.txt
          if grep -q '"ci-dummy"' /tmp/res.txt || grep -q '"1:0:android:0"' /tmp/res.txt; then
            echo "::error::APK com Firebase DUMMY embutido — google-services.json não foi injetado"; exit 1
          fi
          grep -A1 'string/google_app_id' /tmp/res.txt | grep -qE '"1:[0-9]{9,}:' \
            || { echo "::error::google_app_id ausente/inválido no APK"; exit 1; }
          echo "Firebase config OK (google_app_id real presente)"

      - name: Verify signing certificate
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          CERTS=$("$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          # build-tools <= 36 imprime "Signer #1 certificate SHA-256 digest:"; o 37 imprime
          # "V2 Signer: certificate SHA-256 digest:". Aceita os dois e exige um único signatário.
          DIGESTS=$(printf '%s\n' "$CERTS" | sed -n -E 's/^(Signer #1|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' | tr 'A-F' 'a-f' | tr -d ':\r' | sort -u)
          [ "$(printf '%s\n' "$DIGESTS" | grep -c .)" = 1 ] \
            || { echo "::error::Esperado exatamente um certificado de assinatura no APK"; exit 1; }
          SHA256=$DIGESTS
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] && [ "$SHA256" = "$EXPECTED_SIGNING_SHA256" ] \
            || { echo "::error::Certificado do APK difere do keystore de release"; exit 1; }
          echo "Certificado do APK corresponde ao keystore fixo"

      # Nome definitivo do asset: agenva-<versão>.apk (+ .sha256, que o
      # api/scripts/fetch-apk.sh confere antes de publicar na VPS).
      - name: Name APK and check tag
        id: apk
        run: |
          VERSION=$(sed -n -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$VERSION" || { echo "::error::version do pubspec.yaml não encontrada"; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME não bate com o pubspec (v$VERSION)"; exit 1; }
          NAME="agenva-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/$NAME"
          (cd "$RUNNER_TEMP" && sha256sum "$NAME" > "$NAME.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ runner.temp }}/${{ steps.apk.outputs.name }}
            ${{ runner.temp }}/${{ steps.apk.outputs.name }}.sha256
    outputs:
      version: ${{ steps.apk.outputs.version }}

  # Abre um PR na API (base staging) apontando o updater para o novo APK.
  # Token cross-repo vem de um GitHub App (vars.AGENVA_BOT_APP_ID +
  # secrets.AGENVA_BOT_PRIVATE_KEY) com Contents e Pull requests RW só no
  # api-myschedule. Sem o App configurado o job só avisa e não bloqueia o release.
  # Merge do PR só depois de o APK estar na VPS (api/scripts/fetch-apk.sh).
  update-api-version:
    name: PR do version.json na API
    runs-on: ubuntu-latest
    needs: release-android
    env:
      VERSION: ${{ needs.release-android.outputs.version }}
      HAS_APP: ${{ vars.AGENVA_BOT_APP_ID != '' }}
    steps:
      - name: Skip without GitHub App
        if: env.HAS_APP != 'true'
        run: echo "::warning::vars.AGENVA_BOT_APP_ID não configurado — PR do version.json não foi aberto"

      - name: Mint API repo token
        if: env.HAS_APP == 'true'
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AGENVA_BOT_APP_ID }}
          private-key: ${{ secrets.AGENVA_BOT_PRIVATE_KEY }}
          owner: kidev-tec
          repositories: api-myschedule

      - name: Checkout API (staging)
        if: env.HAS_APP == 'true'
        uses: actions/checkout@v4
        with:
          repository: kidev-tec/api-myschedule
          ref: staging
          token: ${{ steps.token.outputs.token }}
          path: api

      - name: Write version.json and open PR
        if: env.HAS_APP == 'true'
        working-directory: api
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(GH_TOKEN=$RELEASE_TOKEN gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body || true)
          [ -n "$BODY" ] || BODY="Nova versão $VERSION do Agenva."
          jq -nc --arg v "$VERSION" --arg u "/apks/agenva-$VERSION.apk" --arg c "$BODY" \
            '{version: $v, apk_url: $u, changelog: $c}' > public/version.json
          if git diff --quiet -- public/version.json; then
            echo "version.json já está em $VERSION"; exit 0
          fi
          BRANCH="feat/release-v$VERSION"
          git switch -c "$BRANCH"
          git -c user.email=mmmarckos@gmail.com -c user.name="Ezequias Fonseca" \
            commit -m "chore(updater): version.json para $VERSION" -- public/version.json
          git push -u origin "$BRANCH"
          gh pr create --base staging --head "$BRANCH" \
            --title "chore(updater): version.json para $VERSION" \
            --body "Aberto pelo release [$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME).

          **Antes do merge**, publicar o APK na VPS (nunca sobrescreve APKs antigos):

          \`\`\`bash
          ./scripts/fetch-apk.sh $VERSION
          \`\`\`

          e conferir \`curl -sI \$API_BASE_URL/v1/apks/agenva-$VERSION.apk\` → 200. Sem isso o app baixa um 404."

  release-ios:
    name: Release iOS (TestFlight)
    uses: ./.github/workflows/ios-testflight.yml
    secrets: inherit

  validate:
    name: Validate Release Gate
    runs-on: ubuntu-latest
    needs: [release-android, release-ios]
    if: always()
    steps:
      - name: Check All Jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success")'
