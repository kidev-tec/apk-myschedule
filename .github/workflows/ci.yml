name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Format Check
        run: dart format --output=none --set-exit-if-changed .

  test:
    name: Test (flutter test) + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Test + Coverage
        run: flutter test --coverage
      - name: Check Coverage Threshold (45%+)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --summary coverage/lcov.info 2>&1 | tee coverage_summary.txt
          COV=$(grep -oP 'lines\.\.\.\s+\K[\d.]+' coverage_summary.txt | head -1)
          COV_INT=${COV%.*}
          if [ "$COV_INT" -lt 45 ]; then
            echo "❌ Coverage ${COV}% below 100% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COV}% meets 100% threshold"
      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Sanitize Gradle properties for CI
        run: |
          sed -i -E '/org\.gradle\.java\.home=/d;/android\.aapt2FromMavenOverride=/d' android/gradle.properties
      - name: Dummy google-services.json (CI)
        run: test -f android/app/google-services.json || cp android/app/google-services.ci.json android/app/google-services.json
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://192.168.1.192:3200/v1
      - name: Verify APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build iOS (simulator)
        run: flutter build ios --simulator --dart-define=API_BASE_URL=http://192.168.1.192:3200/v1
      - name: Verify Build
        run: test -d build/ios/iphonesimulator/Runner.app

  validate:
    name: Validate PR Gate
    runs-on: ubuntu-latest
    needs: [analyze, test, build-android, build-ios]
    if: always()
    steps:
      - name: Check All Jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null && echo "All quality gates passed" || { echo "quality gate failed"; exit 1; }
