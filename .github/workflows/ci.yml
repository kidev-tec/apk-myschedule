name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  FLUTTER_VERSION: '3.24.3'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Format Check
        run: dart format --output=none --set-exit-if-changed .

  test:
    name: Test (flutter test) + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Test + Coverage
        run: flutter test --coverage
      - name: Check Coverage Threshold (90%+)
        run: |
          lcov --summary coverage/lcov.info 2>&1 | tee coverage_summary.txt
          COV=$(grep -oP 'lines\.\.\.\s+\K[\d.]+' coverage_summary.txt | head -1)
          COV_INT=${COV%.*}
          if [ "$COV_INT" -lt 90 ]; then
            echo "❌ Coverage ${COV}% below 90% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COV}% meets 90% threshold"
      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://192.168.1.192:3200/v1
      - name: Verify APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build iOS (simulator)
        run: flutter build ios --simulator --dart-define=API_BASE_URL=http://192.168.1.192:3200/v1
      - name: Verify Build
        run: test -d build/ios/iphonesimulator/Runner.app

  validate:
    name: Validate PR Gate
    runs-on: ubuntu-latest
    needs: [analyze, test, build-android, build-ios]
    if: always()
    steps:
      - name: Check All Jobs
        run: |
          for job in analyze test build-android build-ios; do
            result=${{ needs.$job.result }}
            if [ "$result" != "success" ]; then
              echo "❌ $job failed"
              exit 1
            fi
          done
          echo "✅ All quality gates passed"
