name: minha_agenda
description: "Agenda para profissionais da beleza — Flutter + Riverpod + GoRouter"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.1.0
  image_picker: ^1.1.2
  firebase_messaging: ^15.2.8
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  intl: ^0.20.2
  equatable: ^2.0.5
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  # 6.3.2 exige Dart ^3.6; CI ainda usa Flutter 3.24.3 (Dart 3.5.3)
  url_launcher: '>=6.3.0 <6.3.2'
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  coverage: ^1.15.1
  firebase_core_platform_interface: ^5.0.0
  network_image_mock: ^2.1.1
  http_mock_adapter: ^0.6.1
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf

dependency_overrides:
  # firebase_core 3.15 resolve platform_interface ^5.4.1 → 5.4.2, que gera canais
  # pigeon SEM prefixo e o plugin nativo não escuta → channel-error no initializeApp
  # (splashscreen eterna). 6.0.3 corrige. Ver sessão 15/09/2026.
  firebase_core_platform_interface: 6.0.3
